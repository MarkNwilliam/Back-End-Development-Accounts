[nosetests]
verbosity=2
with-coverage=1
cover-erase=1
cover-package=service
cover-html-dir=cover
cover-html=1
detailed-errors=1
with-xunit=1
xunit-file=nosetests.xml

[coverage:run]
source=service
omit=tests/*

[coverage:report]
show_missing=True

[flake8]
max-line-length=120
exclude=.git,__pycache__,venv,.venv,build,dist
ignore=E226,E24,W503
max-complexity=10

[pylint]
max-line-length=120
ignore=.git,__pycache__,venv,.venv
disable=C0103,C0111,R0903,R0913,W0613
reports=no

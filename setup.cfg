[nosetests]
verbosity=2
with-coverage=1
cover-erase=1
cover-package=service
cover-html-dir=cover
cover-html=1
detailed-errors=1

[coverage:run]
source=service
omit=tests/*

[flake8]
max-line-length=120
exclude=.git,__pycache__,venv,.venv
ignore=E226,E24,W503

[pylint]
max-line-length=120
ignore=.git,__pycache__,venv,.venv
disable=C0103,C0111,R0903,R0913,W0613
